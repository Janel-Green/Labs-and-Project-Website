<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10</title>
</head>
<body>
    <script>
        let answer, tip;
        do{
            answer = Number(prompt(`Enter the total restaurant bill amount-Ex:$55.60`));
            if (answer == 0){
                answer = Number(prompt(`Please enter a bill amount greater than zero.`))
            } else if (answer < 0){
                answer = Number(prompt(`Negative amounts are not allowed. Please enter a valid bill amount.`))
            } else if (isNaN(answer)){
                answer = Number(prompt(`Invalid input. Please enter a numeric bill amount.`))
            }

        } while (answer<= 0 || isNaN(answer));
        tip = answer * 0.10;
        console.log(`For a bill of $${answer.toFixed(2)}, the tip should be $${tip.toFixed(2)}.`);

        document.write(`For a bill of $${answer.toFixed(2)}, the tip should be $${tip.toFixed(2)}.`);
    </script>
    
</body>
</html>
